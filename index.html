<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="Viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
</html>
<body>
    <h2>Program Hitung Umur</h2>
    <label for="tahun">Masukan Tahun Lahir:</label>
    <input type="number" id="tahun" placeholder="contoh: 2000">
    <button onclick="hitungUmur()">Hitung</button>

    <p id="hasil"></p>

    <script>
        function hitungUmur()   {
            let tahunLahir = document.getElementById("tahun").value;
            let tahunSekarang = new Date().getFullYear();
             if (tahunLahir === "") {
            document.getElementById("hasil").innerHTML =
                "isi bang jangan di kosongin karna hati ini sudah kosong!";
        } else if (tahunLahir > tahunSekarang) {
            document.getElementById("hasil").innerHTML =
                "Error:gk bisa bang jangan maksa!!";
        } else {
            let umur = tahunSekarang - tahunLahir;

            document.getElementById("hasil").innerHTML =
                "Umur kamu sekarang adalah " + umur + " tahun.";
        }
        }
    </script>
</body>
